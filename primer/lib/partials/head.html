<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{#if is_index}}{{title}} | Mumbai AI Lab{{else}}{{title}} | How AI Learns{{/if}}</title>
<meta name="description" content="{{description}}">
{{#if noindex}}
<meta name="robots" content="noindex">
{{/if}}
{{#if og_title}}
<meta property="og:title" content="{{og_title}}">
{{/if}}
{{#if og_description}}
<meta property="og:description" content="{{og_description}}">
{{/if}}
{{#if og_url}}
<meta property="og:url" content="{{og_url}}">
{{/if}}
{{#if author}}
<meta name="author" content="{{author}}">
{{/if}}
<link rel="icon" href="{{assets}}favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Spectral+SC:wght@500;600&display=swap" rel="stylesheet">
{{#for lib_css}}
<link rel="stylesheet" href="{{.}}">
{{/for}}
<link rel="stylesheet" href="{{assets}}kit.css">
{{#if own_css}}
<link rel="stylesheet" href="{{slug}}.css">
{{/if}}
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
