<section id="score" aria-labelledby="score-h">
  <h2 id="score-h">Finish and score</h2>
  <p>Press the button when you are done. Blank answers count as missed. The page then locks your answers, shows your score by area and links to the sections to revise. It does not show the correct answers.</p>
  <div class="bar"><button type="button" class="btn btn-main" id="btn-score">Score my answers</button><span class="status" id="score-note" aria-live="polite"></span></div>
  <div class="card res" id="results" tabindex="-1" hidden></div>
</section>
